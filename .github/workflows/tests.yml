name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Godot headless suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GODOT_VERSION: 4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          if [ -x "$HOME/godot/godot" ]; then
            echo "Godot already cached"
            exit 0
          fi
          mkdir -p "$HOME/godot"
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d "$HOME/godot"
          chmod +x "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -sf "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"

      - name: Add Godot to PATH
        run: echo "$HOME/godot" >> "$GITHUB_PATH"

      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: |
          set -euo pipefail
          run() {
            local scene="$1"; shift
            echo "::group::$scene"
            godot --headless --path . "$@" "res://tests/$scene.tscn"
            echo "::endgroup::"
          }
          # Scenes that drive the tree themselves.
          run TestSave
          run TestFlow
          run TestMenu
          run TestMigrations
          run TestMonetization
          run TestGlyphs
          run TestCorruption
          run TestRelease
          run TestRevive
          # Deterministic 60 FPS simulations.
          run TestBattle --fixed-fps 60
          run TestTowers --fixed-fps 60
          run TestProgression --fixed-fps 60
          run TestPolish --fixed-fps 60
          run TestSoak --fixed-fps 60

      - name: Upload Godot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-logs
          path: ~/.local/share/godot/app_userdata/**/logs
          if-no-files-found: ignore
